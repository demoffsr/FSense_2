<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSense Logs - Real-time</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: white;
        }

        .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 12px 24px;
            background: #2a2a2a;
            color: #999;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s;
        }

        .tab:hover {
            background: #3a3a3a;
        }

        .tab.active {
            background: #667eea;
            color: white;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .status {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        .status-dot.yandex {
            background: #ff5722;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #5568d3;
        }

        button:active {
            transform: scale(0.98);
        }

        .logs-container {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            font-size: 13px;
            line-height: 1.6;
            max-height: 60vh;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .log-entry {
            margin-bottom: 2px;
            padding: 4px 0;
        }

        .log-separator {
            border-top: 1px solid #30363d;
            margin: 10px 0;
        }

        .log-header {
            color: #58a6ff;
            font-weight: bold;
        }

        .log-success {
            color: #4ade80;
        }

        .log-error {
            color: #f87171;
        }

        .log-info {
            color: #60a5fa;
        }

        .log-agent {
            color: #fbbf24;
        }

        .log-yandex {
            color: #ff5722;
        }

        .log-product {
            color: #8b5cf6;
        }

        .emoji {
            margin-right: 5px;
        }

        .logs-container::-webkit-scrollbar {
            width: 8px;
        }

        .logs-container::-webkit-scrollbar-track {
            background: #161b22;
            border-radius: 4px;
        }

        .logs-container::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        .logs-container::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6e7681;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .section-header h2 {
            font-size: 18px;
            color: #e0e0e0;
        }

        .section-header .icon {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌸 FSense Monitor</h1>
        <div class="subtitle">Real-time pipeline and search logs</div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('pipeline')">
            🧠 AI Pipeline
        </button>
        <button class="tab" onclick="switchTab('yandex')">
            🔍 Yandex Search (RU)
        </button>
    </div>

    <!-- Pipeline Section -->
    <div id="pipeline-section" class="section active">
        <div class="status">
            <div class="status-item">
                <div class="status-dot"></div>
                <span>Connected</span>
            </div>
            <div class="status-item">
                <span id="pipelineCount">0 requests</span>
            </div>
        </div>

        <div class="controls">
            <button onclick="clearLogs('pipeline')">Clear</button>
            <button onclick="toggleAutoScroll('pipeline')">
                <span id="pipelineAutoScroll">Auto-scroll: ON</span>
            </button>
        </div>

        <div id="pipeline-logs" class="logs-container">
            <div class="empty-state">
                Waiting for pipeline requests...<br>
                Send a chat message from your iOS app ✨
            </div>
        </div>
    </div>

    <!-- Yandex Section -->
    <div id="yandex-section" class="section">
        <div class="status">
            <div class="status-item">
                <div class="status-dot yandex"></div>
                <span>Connected</span>
            </div>
            <div class="status-item">
                <span id="yandexCount">0 searches</span>
            </div>
        </div>

        <div class="controls">
            <button onclick="clearLogs('yandex')">Clear</button>
            <button onclick="toggleAutoScroll('yandex')">
                <span id="yandexAutoScroll">Auto-scroll: ON</span>
            </button>
        </div>

        <div id="yandex-logs" class="logs-container">
            <div class="empty-state">
                Waiting for Yandex searches...<br>
                Tap "Find Flowers" in the app 🌹
            </div>
        </div>
    </div>

    <script>
        let autoScroll = { pipeline: true, yandex: true };
        let requestCount = { pipeline: 0, yandex: 0 };
        let eventSource = null;

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));

            document.querySelector(`.tab:nth-child(${tab === 'pipeline' ? 1 : 2})`).classList.add('active');
            document.getElementById(`${tab}-section`).classList.add('active');
        }

        function connectToStream() {
            if (eventSource) {
                eventSource.close();
            }

            eventSource = new EventSource('/api/logs/stream');

            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    console.log('Received log:', data);

                    // Route to appropriate section
                    if (data.source === 'yandex' || data.type?.startsWith('yandex_')) {
                        addYandexEntry(data);
                    } else {
                        addPipelineEntry(data);
                    }
                } catch (e) {
                    console.error('Failed to parse log:', event.data, e);
                }
            };

            eventSource.onerror = function() {
                console.log('Connection lost, reconnecting...');
                setTimeout(connectToStream, 3000);
            };
        }

        function addPipelineEntry(data) {
            const logsDiv = document.getElementById('pipeline-logs');

            if (data.type === 'keepalive') return;

            if (logsDiv.querySelector('.empty-state')) {
                logsDiv.innerHTML = '';
            }

            const entry = document.createElement('div');
            entry.className = 'log-entry';

            if (data.type === 'separator') {
                entry.className = 'log-separator';
            } else if (data.type === 'pipeline_start') {
                requestCount.pipeline++;
                document.getElementById('pipelineCount').textContent = `${requestCount.pipeline} requests`;
                entry.className = 'log-entry log-header';
                entry.innerHTML = `<span class="emoji">🚀</span>${escapeHtml(data.message || 'PIPELINE STARTED')}`;
            } else if (data.type === 'pipeline_end') {
                entry.className = 'log-entry log-success';
                entry.innerHTML = `<span class="emoji">✅</span>${escapeHtml(data.message || 'PIPELINE COMPLETED')}`;
            } else if (data.type === 'agent_start') {
                entry.className = 'log-entry log-agent';
                entry.innerHTML = `<span class="emoji">${data.emoji || '🔧'}</span>${escapeHtml(data.message || data.agent)}`;
            } else if (data.type === 'agent_result') {
                entry.className = 'log-entry log-info';
                entry.innerHTML = `  • ${escapeHtml(data.message || data.key + ': ' + data.value)}`;
            } else if (data.type === 'agent_end') {
                entry.className = 'log-entry log-success';
                entry.innerHTML = `<span class="emoji">✅</span>${escapeHtml(data.message || data.agent + ' completed')}`;
            } else if (data.type === 'error') {
                entry.className = 'log-entry log-error';
                entry.innerHTML = `<span class="emoji">❌</span>${escapeHtml(data.message || data.error)}`;
            } else {
                entry.textContent = data.message || JSON.stringify(data);
            }

            logsDiv.appendChild(entry);
            if (autoScroll.pipeline) logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function addYandexEntry(data) {
            const logsDiv = document.getElementById('yandex-logs');

            if (data.type === 'keepalive') return;

            if (logsDiv.querySelector('.empty-state')) {
                logsDiv.innerHTML = '';
            }

            const entry = document.createElement('div');
            entry.className = 'log-entry';

            if (data.type === 'yandex_search_start') {
                requestCount.yandex++;
                document.getElementById('yandexCount').textContent = `${requestCount.yandex} searches`;
                entry.className = 'log-entry log-yandex';
                entry.innerHTML = `<span class="emoji">🔍</span><strong>SEARCH:</strong> ${escapeHtml(data.query)} in ${escapeHtml(data.city)}`;
            } else if (data.type === 'yandex_cache_hit') {
                requestCount.yandex++;
                document.getElementById('yandexCount').textContent = `${requestCount.yandex} searches`;
                entry.className = 'log-entry log-success';
                entry.innerHTML = `<span class="emoji">💾</span><strong>CACHE HIT:</strong> ${escapeHtml(data.query)} in ${escapeHtml(data.city)} (${data.count} products)`;
            } else if (data.type === 'yandex_search_end') {
                entry.className = 'log-entry log-success';
                entry.innerHTML = `<span class="emoji">✅</span>Found ${data.count} products (${data.time}s)`;
            } else if (data.type === 'yandex_product') {
                entry.className = 'log-entry log-product';
                const price = data.price || 'N/A';
                entry.innerHTML = `  • ${escapeHtml(data.name.substring(0, 50))}... | <strong>${price}</strong> | ${escapeHtml(data.vendor)}`;
            } else if (data.type === 'yandex_error') {
                entry.className = 'log-entry log-error';
                entry.innerHTML = `<span class="emoji">❌</span>${escapeHtml(data.message || data.error)}`;
            } else if (data.type === 'separator' || data.type === 'yandex_separator') {
                entry.className = 'log-separator';
            } else {
                entry.textContent = data.message || JSON.stringify(data);
            }

            logsDiv.appendChild(entry);
            if (autoScroll.yandex) logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearLogs(section) {
            const msg = section === 'pipeline'
                ? 'Waiting for pipeline requests...'
                : 'Waiting for Yandex searches...';
            document.getElementById(`${section}-logs`).innerHTML = `<div class="empty-state">${msg}</div>`;
            requestCount[section] = 0;
            document.getElementById(`${section}Count`).textContent = section === 'pipeline' ? '0 requests' : '0 searches';
        }

        function toggleAutoScroll(section) {
            autoScroll[section] = !autoScroll[section];
            document.getElementById(`${section}AutoScroll`).textContent = `Auto-scroll: ${autoScroll[section] ? 'ON' : 'OFF'}`;
        }

        connectToStream();
    </script>
</body>
</html>
