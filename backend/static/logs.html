<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSense Pipeline Logs - Real-time</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: white;
        }

        .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
        }

        .status {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #5568d3;
        }

        button:active {
            transform: scale(0.98);
        }

        #logs {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            font-size: 13px;
            line-height: 1.6;
            max-height: 70vh;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .log-entry {
            margin-bottom: 2px;
            padding: 4px 0;
        }

        .log-separator {
            border-top: 1px solid #30363d;
            margin: 10px 0;
        }

        .log-header {
            color: #58a6ff;
            font-weight: bold;
        }

        .log-success {
            color: #4ade80;
        }

        .log-error {
            color: #f87171;
        }

        .log-info {
            color: #60a5fa;
        }

        .log-agent {
            color: #fbbf24;
        }

        .emoji {
            margin-right: 5px;
        }

        #logs::-webkit-scrollbar {
            width: 8px;
        }

        #logs::-webkit-scrollbar-track {
            background: #161b22;
            border-radius: 4px;
        }

        #logs::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        #logs::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6e7681;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌸 FSense Pipeline Monitor</h1>
        <div class="subtitle">Real-time agent execution logs</div>
    </div>

    <div class="status">
        <div class="status-item">
            <div class="status-dot"></div>
            <span>Connected to server</span>
        </div>
        <div class="status-item">
            <span id="requestCount">0 requests processed</span>
        </div>
    </div>

    <div class="controls">
        <button onclick="clearLogs()">Clear Logs</button>
        <button onclick="toggleAutoScroll()">
            <span id="autoScrollText">Auto-scroll: ON</span>
        </button>
    </div>

    <div id="logs">
        <div class="empty-state">
            Waiting for pipeline requests...<br>
            Send a request from your iOS app to see the magic! ✨
        </div>
    </div>

    <script>
        let autoScroll = true;
        let requestCount = 0;
        let eventSource = null;
        let reconnectInterval = null;

        function connectToStream() {
            if (eventSource) {
                eventSource.close();
            }

            eventSource = new EventSource('/api/logs/stream');

            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    console.log('Received log:', data);
                    addLogEntry(data);
                } catch (e) {
                    console.error('Failed to parse log:', event.data, e);
                    addLogEntry({type: 'error', message: 'Parse error: ' + event.data});
                }
            };

            eventSource.onerror = function() {
                console.log('Connection lost, reconnecting...');
                setTimeout(connectToStream, 3000);
            };
        }

        function addLogEntry(data) {
            const logsDiv = document.getElementById('logs');

            // Skip keepalive
            if (data.type === 'keepalive') {
                return;
            }

            // Remove empty state
            if (logsDiv.querySelector('.empty-state')) {
                logsDiv.innerHTML = '';
            }

            const entry = document.createElement('div');
            entry.className = 'log-entry';

            // Handle different log types
            if (data.type === 'separator') {
                entry.className = 'log-separator';
            } else if (data.type === 'pipeline_start') {
                requestCount++;
                document.getElementById('requestCount').textContent = `${requestCount} requests processed`;
                entry.className = 'log-entry log-header';
                const msg = data.message || `PIPELINE STARTED | Request: ${data.request_id || 'unknown'}`;
                entry.innerHTML = `<span class="emoji">🚀</span>${escapeHtml(msg)}`;
            } else if (data.type === 'pipeline_end') {
                entry.className = 'log-entry log-success';
                const msg = data.message || 'PIPELINE COMPLETED';
                entry.innerHTML = `<span class="emoji">✅</span>${escapeHtml(msg)}`;
            } else if (data.type === 'agent_start') {
                entry.className = 'log-entry log-agent';
                const emoji = data.emoji || '🔧';
                const msg = data.message || `${data.agent} starting...`;
                entry.innerHTML = `<span class="emoji">${emoji}</span>${escapeHtml(msg)}`;
            } else if (data.type === 'agent_result') {
                entry.className = 'log-entry log-info';
                const msg = data.message || `${data.key}: ${data.value}`;
                entry.innerHTML = `  • ${escapeHtml(msg)}`;
            } else if (data.type === 'agent_end') {
                entry.className = 'log-entry log-success';
                const msg = data.message || `${data.agent} completed`;
                entry.innerHTML = `<span class="emoji">✅</span>${escapeHtml(msg)}`;
            } else if (data.type === 'error') {
                entry.className = 'log-entry log-error';
                const msg = data.message || data.error || 'Unknown error';
                entry.innerHTML = `<span class="emoji">❌</span>${escapeHtml(msg)}`;
            } else {
                // Fallback
                const msg = data.message || JSON.stringify(data);
                entry.textContent = msg;
            }

            logsDiv.appendChild(entry);

            if (autoScroll) {
                logsDiv.scrollTop = logsDiv.scrollHeight;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '<div class="empty-state">Logs cleared. Waiting for new requests...</div>';
            requestCount = 0;
            document.getElementById('requestCount').textContent = '0 requests processed';
        }

        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            document.getElementById('autoScrollText').textContent = `Auto-scroll: ${autoScroll ? 'ON' : 'OFF'}`;
        }

        // Connect on load
        connectToStream();
    </script>
</body>
</html>
